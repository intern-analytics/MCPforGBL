<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCPforGBL | Developer Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg-dark: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --border: rgba(255, 255, 255, 0.1);
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --success: #10b981;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            transition: all 0.2s ease;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(79, 70, 229, 0.1) 0px, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 450px;
            padding: 2rem;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 1rem;
            backdrop-filter: blur(12px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.5s ease forwards;
        }

        h2 {
            margin-bottom: 0.5rem;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 0.875rem;
            margin-bottom: 2rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            font-size: 0.875rem;
            margin-bottom: 0.5rem;
            color: var(--text-muted);
        }

        input, select {
            width: 100%;
            padding: 0.75rem;
            border-radius: 0.5rem;
            background: #0f172a;
            border: 1px solid var(--border);
            color: white;
            outline: none;
            font-family: 'Inter', sans-serif;
        }

        input:focus, select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
        }

        .btn {
            width: 100%;
            padding: 0.75rem;
            border-radius: 0.5rem;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            border: none;
            background: var(--primary);
            color: white;
        }

        .btn:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
        }

        .btn:disabled {
            background: var(--text-muted);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .success-box {
            display: none;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid var(--success);
            color: var(--success);
            padding: 1rem;
            border-radius: 0.5rem;
            margin-top: 1.5rem;
            text-align: center;
            font-size: 0.9rem;
        }

        .error-box {
            display: none;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid #ef4444;
            color: #ef4444;
            padding: 1rem;
            border-radius: 0.5rem;
            margin-top: 1.5rem;
            text-align: center;
            font-size: 0.9rem;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>MCPforGBL Access</h2>
        <p class="subtitle">Request an API Key for your brand data.</p>

        <div class="form-group">
            <label for="end_user">Email Address</label>
            <input type="email" id="end_user" placeholder="your.email@example.com" required>
        </div>

        <div class="form-group">
            <label>Brands</label>
            <div id="brands-checkbox-list" style="max-height: 200px; overflow-y: auto; background: #0f172a; border: 1px solid var(--border); border-radius: 0.5rem; padding: 0.5rem;">
                <div style="color: var(--text-muted); padding: 0.5rem;">Loading brands...</div>
            </div>
        </div>

        <button id="generate-btn" class="btn" onclick="generateKey()">Send API Key to Email</button>

        <div id="success-message" class="success-box">
            ✅ Success! Your API key has been generated and sent to your email address.
        </div>

        <div id="error-message" class="error-box">
            ❌ Error generating key. Please try again or contact GBL - Tech.
        </div>
    </div>

    <script>
        // Use the same routing convention as the admin panel
        const API_BASE = window.location.pathname.includes('/admin-api') ? '/admin-api' : '';

        async function fetchBrands() {
            try {
                const response = await fetch(`${API_BASE}/brands`);
                const data = await response.json();
                const container = document.getElementById('brands-checkbox-list');
                container.innerHTML = '';
                data.brands.forEach(b => {
                    // Exclude super_user from the public portal list
                    if (b.brand_id !== 'super_user') {
                        const div = document.createElement('div');
                        div.style.padding = '0.5rem';
                        div.style.display = 'flex';
                        div.style.alignItems = 'center';
                        div.style.gap = '0.75rem';
                        
                        const cb = document.createElement('input');
                        cb.type = 'checkbox';
                        cb.value = b.brand_id;
                        cb.id = 'chk_' + b.brand_id;
                        cb.style.width = 'auto';
                        cb.style.cursor = 'pointer';
                        
                        const lbl = document.createElement('label');
                        lbl.htmlFor = 'chk_' + b.brand_id;
                        lbl.textContent = b.tool_name;
                        lbl.style.margin = '0';
                        lbl.style.color = 'white';
                        lbl.style.cursor = 'pointer';
                        
                        div.appendChild(cb);
                        div.appendChild(lbl);
                        container.appendChild(div);
                    }
                });
            } catch (err) {
                console.error("Failed to load brands", err);
                const container = document.getElementById('brands-checkbox-list');
                container.innerHTML = '<div style="color: #ef4444; padding: 0.5rem;">Error loading brands</div>';
            }
        }

        async function generateKey() {
            const email = document.getElementById('end_user').value;
            const checkboxes = document.querySelectorAll('#brands-checkbox-list input[type="checkbox"]:checked');
            const selectedBrands = Array.from(checkboxes).map(cb => cb.value);
            
            const btn = document.getElementById('generate-btn');
            const successBox = document.getElementById('success-message');
            const errorBox = document.getElementById('error-message');

            successBox.style.display = 'none';
            errorBox.style.display = 'none';

            if (!email || selectedBrands.length === 0) {
                errorBox.textContent = "Please provide both an email address and select at least one brand.";
                errorBox.style.display = 'block';
                return;
            }

            btn.disabled = true;
            btn.textContent = "Generating & Sending...";

            try {
                const response = await fetch(`${API_BASE}/keys/generate`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ end_user: email, brand_names: selectedBrands })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    successBox.textContent = '✅ ' + (data.message || 'Success! Your API key has been generated and sent to your email address.');
                    successBox.style.display = 'block';
                    document.getElementById('end_user').value = '';
                    document.querySelectorAll('#brands-checkbox-list input[type="checkbox"]').forEach(cb => cb.checked = false);
                } else {
                    errorBox.textContent = `❌ ${data.detail || 'Failed to generate API key.'}`;
                    errorBox.style.display = 'block';
                }
            } catch (err) {
                console.error(err);
                errorBox.textContent = "❌ Network error. Please try again later.";
                errorBox.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.textContent = "Send API Key to Email";
            }
        }

        // Initialize brands on load
        fetchBrands();
    </script>
</body>
</html>
